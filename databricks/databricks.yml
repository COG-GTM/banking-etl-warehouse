# Databricks Asset Bundle for the banking ETL warehouse (Talend + SQL Server -> Databricks).
# Each workload adds its own job/pipeline file under resources/; do not list them here.
bundle:
  name: banking_etl_warehouse

include:
  - resources/*.yml

artifacts:
  banking_etl:
    type: whl
    path: .
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold schemas
    default: banking_dwh
  schema_prefix:
    description: Optional prefix for every schema (e.g. ci_42_) to isolate a run inside a shared catalog
    default: ""
  create_catalog:
    description: Whether uc_setup runs CREATE CATALOG (false if the catalog is pre-provisioned)
    default: "true"

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
