name: databricks-ci

on:
  push:
    branches: [main]
    paths:
      - "databricks/**"
      - ".github/workflows/databricks-ci.yml"
  pull_request:
    paths:
      - "databricks/**"
      - ".github/workflows/databricks-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: databricks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: databricks/pyproject.toml
      - name: Cache Spark/Ivy jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-delta-4.0.0
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -v
      - name: Build wheel
        run: pip install build && python -m build --wheel

  bundle-validate:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev, prod)
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "::notice::Databricks secrets not configured; skipping bundle validate"
            exit 0
          fi
          databricks bundle validate --strict -t dev
          databricks bundle validate --strict -t prod
