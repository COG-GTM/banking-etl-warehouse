# Spark driver/executor identity. IRSA: the annotated IAM role (deploy/terraform, output
# spark_irsa_role_arn) grants S3 access to the Delta/landing bucket and read access to the
# SQL Server credentials secret in AWS Secrets Manager. No static AWS keys are used.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-etl-spark
  namespace: banking-etl
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/banking-etl-spark-irsa
---
# Spark on Kubernetes: the driver creates/deletes executor pods and its headless service.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-etl-spark-driver
  namespace: banking-etl
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, get, list, watch, update, patch, delete, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-etl-spark-driver
  namespace: banking-etl
subjects:
  - kind: ServiceAccount
    name: banking-etl-spark
    namespace: banking-etl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-etl-spark-driver
