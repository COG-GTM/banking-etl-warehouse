# Identity for the Argo workflow pods: create/watch SparkApplications and report task results.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-etl-argo
  namespace: banking-etl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-etl-argo
  namespace: banking-etl
rules:
  - apiGroups: [sparkoperator.k8s.io]
    resources: [sparkapplications]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-etl-argo
  namespace: banking-etl
subjects:
  - kind: ServiceAccount
    name: banking-etl-argo
    namespace: banking-etl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-etl-argo
